<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NEON.typer | Cyber Typing Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    :root {
      --cyan: #00f3ff;
      --magenta: #ff007f;
      --yellow: #ffe600;
      --bg: #070913;
      --panel: rgba(13, 17, 34, 0.85);
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #app {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 10px 14px;
      justify-content: space-between;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
    }

    .brand {
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
    }

    .brand span {
      color: var(--magenta);
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
    }

    .stats-badge {
      display: flex;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .badge-item {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--cyan);
    }

    .arena {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px 0;
    }

    .combo-banner {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--yellow);
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.8);
      margin-bottom: 12px;
      min-height: 20px;
    }

    .word-box {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      max-width: 95%;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.1s, border-color 0.2s;
    }

    .word-box.shake {
      animation: shake 0.25s ease-in-out;
      border-color: #ff3344;
      box-shadow: 0 0 25px rgba(255, 51, 68, 0.4);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .char-tile {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 44px;
      border-radius: 8px;
      font-size: 1.45rem;
      font-weight: 900;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.04);
      color: #718096;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .char-tile.typed {
      color: var(--cyan);
      background: rgba(0, 243, 255, 0.18);
      border-color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan);
    }

    .char-tile.current {
      color: #fff;
      background: rgba(255, 0, 127, 0.25);
      border-color: var(--magenta);
      box-shadow: 0 0 12px var(--magenta);
      transform: translateY(-2px) scale(1.06);
    }

    .timer-track {
      width: 86%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      margin-top: 20px;
      overflow: hidden;
    }

    .timer-laser {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      box-shadow: 0 0 12px var(--cyan);
      transition: width 0.05s linear;
    }

    .timer-laser.urgent {
      background: linear-gradient(90deg, #ff3344, var(--yellow));
      box-shadow: 0 0 15px #ff3344;
    }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      padding-bottom: 6px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 5px;
      width: 100%;
    }

    .key {
      flex: 1;
      max-width: 44px;
      height: 48px;
      background: rgba(20, 25, 45, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key:active, .key.pressed {
      background: rgba(0, 243, 255, 0.3);
      border-color: var(--cyan);
      transform: scale(0.92);
      color: #fff;
    }

    .key.highlight {
      border-color: var(--magenta);
      background: rgba(255, 0, 127, 0.2);
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
      color: #fff;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 6, 15, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-card {
      background: rgba(13, 18, 38, 0.95);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.2);
    }

    .modal-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 6px;
      color: #fff;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
    }

    .modal-subtitle {
      color: #a0aec0;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .diff-group {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      width: 100%;
    }

    .diff-btn {
      flex: 1;
      padding: 12px 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #a0aec0;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .diff-btn .time-hint {
      display: block;
      font-size: 0.7rem;
      font-weight: normal;
      margin-top: 4px;
      opacity: 0.8;
    }

    .diff-btn.active[data-diff="EASY"] {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    }

    .diff-btn.active[data-diff="MEDIUM"] {
      background: rgba(255, 230, 0, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
      box-shadow: 0 0 12px rgba(255, 230, 0, 0.4);
    }

    .diff-btn.active[data-diff="HARD"] {
      background: rgba(255, 0, 127, 0.2);
      border-color: var(--magenta);
      color: var(--magenta);
      box-shadow: 0 0 14px rgba(255, 0, 127, 0.5);
    }

    .start-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      touch-action: manipulation;
    }

    .start-btn:active {
      transform: scale(0.97);
    }

    .score-readout {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #a0aec0;
    }

    .score-readout strong {
      color: var(--cyan);
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div id="app">
    <header>
      <div class="brand">NEON<span>.TYPER</span></div>
      <div class="stats-badge">
        <div class="badge-item" id="hudDiff">EASY</div>
        <div class="badge-item" id="hudScore">0 PTS</div>
      </div>
    </header>

    <main class="arena">
      <div class="combo-banner" id="comboBanner">READY TO HACK</div>
      <div class="word-box" id="wordBox"></div>
      <div class="timer-track">
        <div class="timer-laser" id="timerLaser"></div>
      </div>
    </main>

    <footer class="keyboard" id="keyboard">
      <div class="kb-row">
        <div class="key" data-key="q">Q</div>
        <div class="key" data-key="w">W</div>
        <div class="key" data-key="e">E</div>
        <div class="key" data-key="r">R</div>
        <div class="key" data-key="t">T</div>
        <div class="key" data-key="y">Y</div>
        <div class="key" data-key="u">U</div>
        <div class="key" data-key="i">I</div>
        <div class="key" data-key="o">O</div>
        <div class="key" data-key="p">P</div>
      </div>
      <div class="kb-row">
        <div class="key" data-key="a">A</div>
        <div class="key" data-key="s">S</div>
        <div class="key" data-key="d">D</div>
        <div class="key" data-key="f">F</div>
        <div class="key" data-key="g">G</div>
        <div class="key" data-key="h">H</div>
        <div class="key" data-key="j">J</div>
        <div class="key" data-key="k">K</div>
        <div class="key" data-key="l">L</div>
      </div>
      <div class="kb-row">
        <div class="key" data-key="z">Z</div>
        <div class="key" data-key="x">X</div>
        <div class="key" data-key="c">C</div>
        <div class="key" data-key="v">V</div>
        <div class="key" data-key="b">B</div>
        <div class="key" data-key="n">N</div>
        <div class="key" data-key="m">M</div>
      </div>
    </footer>
  </div>

  <div class="modal-overlay" id="menuModal">
    <div class="modal-card">
      <div class="modal-title">NEON.TYPER</div>
      <p class="modal-subtitle">CHOOSE DIFFICULTY LEVEL</p>

      <div class="diff-group">
        <button class="diff-btn active" data-diff="EASY">
          EASY
          <span class="time-hint">5s • 3-5 Letters</span>
        </button>
        <button class="diff-btn" data-diff="MEDIUM">
          MEDIUM
          <span class="time-hint">5s • 6-9 Letters</span>
        </button>
        <button class="diff-btn" data-diff="HARD">
          HARD
          <span class="time-hint">3s • 6-9 Letters</span>
        </button>
      </div>

      <button class="start-btn" id="startBtn">START GAME</button>
      <div class="score-readout" id="menuHighScore">High Score: <strong>0</strong></div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="gameOverModal">
    <div class="modal-card">
      <div class="modal-title" style="color: #ff3344;">SYSTEM PURGE</div>
      <p class="modal-subtitle">LASER COUNTDOWN EXPIRED</p>

      <div style="font-size: 1.8rem; font-weight: 900; color: var(--cyan); margin-bottom: 6px;" id="finalScore">0</div>
      <div style="font-size: 0.85rem; color: #a0aec0; margin-bottom: 20px;" id="finalStats">Words: 0 | Streak: 0</div>

      <button class="start-btn" id="retryBtn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    // All words strictly < 10 characters
    const EASY_WORDS = [
      "neon", "cyber", "grid", "hack", "laser", "flux", "core", "byte", "sync",
      "data", "code", "node", "pulse", "echo", "warp", "wave", "volt", "glow",
      "fast", "rush", "spark", "mesh", "gate", "link", "matrix", "synth", "drive",
      "sonic", "hyper", "shift", "orbit", "flare", "pixel", "blaze", "surge"
    ];

    const BIG_WORDS = [
      "android", "cipher", "circuit", "console", "quantum", "gravity", "network",
      "protocol", "terminal", "algorithm", "firewall", "glitchy", "infinite",
      "override", "satellite", "vector", "velocity", "virtual",
      "waveform", "dynamo", "frequency", "hologram", "junction", "overclock"
    ].filter(w => w.length < 10);

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, gainVal = 0.2) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let difficulty = "EASY";
    let score = 0;
    let combo = 0;
    let wordsCompleted = 0;
    let maxCombo = 0;
    let currentWord = "";
    let typedIndex = 0;
    let timeLeft = 5.0;
    let totalTime = 5.0;
    let gameActive = false;
    let lastTime = 0;

    const wordBox = document.getElementById('wordBox');
    const timerLaser = document.getElementById('timerLaser');
    const hudDiff = document.getElementById('hudDiff');
    const hudScore = document.getElementById('hudScore');
    const comboBanner = document.getElementById('comboBanner');
    const menuModal = document.getElementById('menuModal');
    const gameOverModal = document.getElementById('gameOverModal');
    const menuHighScore = document.getElementById('menuHighScore');
    const finalScore = document.getElementById('finalScore');
    const finalStats = document.getElementById('finalStats');

    const DIFF_CONFIG = {
      EASY: { time: 5.0, words: EASY_WORDS },
      MEDIUM: { time: 5.0, words: BIG_WORDS },
      HARD: { time: 3.0, words: BIG_WORDS }
    };

    function updateHighScoreDisplay() {
      const saved = localStorage.getItem(`neon_hs_${difficulty}`) || 0;
      menuHighScore.innerHTML = `High Score (${difficulty}): <strong>${saved}</strong>`;
    }

    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        difficulty = btn.dataset.diff;
        updateHighScoreDisplay();
        if (navigator.vibrate) navigator.vibrate(15);
      });
    });

    function getNextWord() {
      const list = DIFF_CONFIG[difficulty].words;
      let next = list[Math.floor(Math.random() * list.length)];
      if (next === currentWord && list.length > 1) {
        next = list[(list.indexOf(next) + 1) % list.length];
      }
      return next;
    }

    function renderWord() {
      wordBox.innerHTML = '';
      for (let i = 0; i < currentWord.length; i++) {
        const span = document.createElement('span');
        span.className = 'char-tile';
        if (i < typedIndex) span.classList.add('typed');
        else if (i === typedIndex) span.classList.add('current');
        span.textContent = currentWord[i];
        wordBox.appendChild(span);
      }
      highlightNextKey();
    }

    function highlightNextKey() {
      document.querySelectorAll('.key').forEach(k => k.classList.remove('highlight'));
      if (typedIndex < currentWord.length) {
        const target = currentWord[typedIndex].toLowerCase();
        const keyEl = document.querySelector(`.key[data-key="${target}"]`);
        if (keyEl) keyEl.classList.add('highlight');
      }
    }

    function startGame() {
      initAudio();
      score = 0;
      combo = 0;
      wordsCompleted = 0;
      maxCombo = 0;
      totalTime = DIFF_CONFIG[difficulty].time;
      timeLeft = totalTime;
      hudDiff.textContent = difficulty;
      hudScore.textContent = `${score} PTS`;
      comboBanner.textContent = "READY TO HACK";

      menuModal.classList.add('hidden');
      gameOverModal.classList.add('hidden');

      currentWord = getNextWord();
      typedIndex = 0;
      renderWord();

      gameActive = true;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function handleKeyPress(char) {
      if (!gameActive) return;
      const keyChar = char.toLowerCase();
      const targetChar = currentWord[typedIndex].toLowerCase();

      const keyEl = document.querySelector(`.key[data-key="${keyChar}"]`);
      if (keyEl) {
        keyEl.classList.add('pressed');
        setTimeout(() => keyEl.classList.remove('pressed'), 120);
      }

      if (keyChar === targetChar) {
        typedIndex++;
        playTone(587.33, 'triangle', 0.08, 0.25);
        if (navigator.vibrate) navigator.vibrate(10);
        renderWord();

        if (typedIndex >= currentWord.length) {
          wordsCompleted++;
          combo++;
          if (combo > maxCombo) maxCombo = combo;

          const wordScore = currentWord.length * 20 * (1 + Math.floor(combo / 5));
          score += wordScore;
          hudScore.textContent = `${score} PTS`;

          comboBanner.textContent = combo > 1 ? `⚡ ${combo}X COMBO (+${wordScore})` : "NICE HIT!";
          playTone(880, 'sine', 0.15, 0.3);
          setTimeout(() => playTone(1174.66, 'sine', 0.2, 0.35), 70);
          if (navigator.vibrate) navigator.vibrate([15, 30, 20]);

          currentWord = getNextWord();
          typedIndex = 0;
          timeLeft = totalTime;
          renderWord();
        }
      } else {
        combo = 0;
        comboBanner.textContent = "MISSTEP! STREAK RESET";
        wordBox.classList.add('shake');
        setTimeout(() => wordBox.classList.remove('shake'), 250);
        if (navigator.vibrate) navigator.vibrate([40, 30, 40]);
      }
    }

    function gameOver() {
      gameActive = false;
      playTone(150, 'sawtooth', 0.35, 0.3);
      if (navigator.vibrate) navigator.vibrate(250);

      const currentHs = parseInt(localStorage.getItem(`neon_hs_${difficulty}`) || "0", 10);
      if (score > currentHs) {
        localStorage.setItem(`neon_hs_${difficulty}`, score.toString());
      }

      finalScore.textContent = `${score} POINTS`;
      finalStats.textContent = `Difficulty: ${difficulty} | Words: ${wordsCompleted} | Max Combo: ${maxCombo}x`;
      gameOverModal.classList.remove('hidden');
    }

    function gameLoop(now) {
      if (!gameActive) return;

      const delta = (now - lastTime) / 1000;
      lastTime = now;

      timeLeft -= delta;
      if (timeLeft <= 0) {
        timeLeft = 0;
        timerLaser.style.width = '0%';
        gameOver();
        return;
      }

      const pct = (timeLeft / totalTime) * 100;
      timerLaser.style.width = `${pct}%`;

      if (timeLeft <= 1.2) {
        timerLaser.classList.add('urgent');
      } else {
        timerLaser.classList.remove('urgent');
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
        handleKeyPress(e.key);
      }
    });

    document.querySelectorAll('.key').forEach(k => {
      k.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleKeyPress(k.dataset.key);
      });
    });

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', () => {
      gameOverModal.classList.add('hidden');
      menuModal.classList.remove('hidden');
      updateHighScoreDisplay();
    });

    const
